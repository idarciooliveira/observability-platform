services:
  insurance-api:
    build:
      context: ./insurance-api
      dockerfile: Dockerfile
    container_name: example-insurance-api
    ports:
      - "${INSURANCE_API_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      risk-service:
        condition: service_started
    networks:
      - insurance-direct
    extra_hosts:
      # No-op on Docker Desktop (Win/Mac); required on native Linux Engine
      # so host.docker.internal resolves to the host gateway.
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-insurance_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-insurance_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-insurance_pass}
      RISK_SERVICE_URL: http://risk-service:8082
      # Variant B (direct OTLP): app -> platform gateway, no local collector.
      # Gateway serves OTLP/HTTP only -> must be http/protobuf, never grpc.
      # Endpoint is the platform compose.local.yml gateway via Docker internal.
      OTEL_SERVICE_NAME: insurance-api
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=insurance,deployment.environment=${ENV:-dev}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: 15000
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # ubix tenant credential from observability-platform/.env (UBIX_OTEL_TOKEN).
      # Platform derives project.id=ubix from this credential and overwrites
      # any client-supplied value. Do NOT set project.id / X-Scope-OrgID here.
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${UBIX_OTEL_TOKEN:?UBIX_OTEL_TOKEN must be set}
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"

  risk-service:
    build:
      context: ./risk-service
      dockerfile: Dockerfile
    container_name: example-insurance-risk-service
    ports:
      - "${RISK_SERVICE_PORT:-8082}:8082"
    networks:
      - insurance-direct
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OTEL_SERVICE_NAME: risk-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=insurance,deployment.environment=${ENV:-dev}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: 15000
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${UBIX_OTEL_TOKEN:?UBIX_OTEL_TOKEN must be set}
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
      CHAOS_REJECT_RATE: ${CHAOS_REJECT_RATE:-0}

  postgres:
    image: postgres:16-alpine
    container_name: example-insurance-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance_db}
      POSTGRES_USER: ${POSTGRES_USER:-insurance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insurance_pass}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - insurance-postgres-data:/var/lib/postgresql/data
    networks:
      - insurance-direct
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insurance_user} -d ${POSTGRES_DB:-insurance_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  insurance-postgres-data:

networks:
  insurance-direct:
    name: insurance-direct
