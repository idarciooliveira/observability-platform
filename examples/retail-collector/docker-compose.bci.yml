# Variant B: retail-collector reporting as bci_digiflow (company=bci, project=digiflow).
# Same app as docker-compose.yml (variant A = keve_digiflow) with a distinct
# credential, distinct host ports (8094/5444), distinct containers and a
# distinct network so both variants run side by side.
# Usage: docker compose -f docker-compose.bci.yml --env-file .env.bci up -d --build
name: retail-collector-bci
services:
  retail-api:
    build:
      context: ./retail-api
      dockerfile: Dockerfile
    container_name: example-retail-api-bci
    restart: unless-stopped
    ports:
      - "${RETAIL_API_PORT:-8094}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      retail-collector:
        condition: service_started
    networks:
      - retail-example-bci
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-retail_orders}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-retail_orders}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-retail_orders}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-retail-api}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=retail,deployment.environment=${ENV:-dev}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://retail-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
      CHAOS_FAIL_RATE: ${CHAOS_FAIL_RATE:-0}

  retail-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: example-retail-collector-bci
    restart: unless-stopped
    user: "0"
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./collector/collector-config.yaml:/etc/otel/collector-config.yaml:ro
      - retail-collector-queue-bci:/var/lib/otelcol
    networks:
      - retail-example-bci
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # bci_digiflow instance credential (BCI_DIGIFLOW_OTEL_TOKEN).
      INSTANCE_OTEL_TOKEN: ${BCI_DIGIFLOW_OTEL_TOKEN:?BCI_DIGIFLOW_OTEL_TOKEN must be set}
    healthcheck:
      test: ["NONE"]

  postgres:
    image: postgres:16-alpine
    container_name: example-retail-postgres-bci
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_orders}
      POSTGRES_USER: ${POSTGRES_USER:-retail_orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_orders}
    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - retail-postgres-data-bci:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail_orders} -d ${POSTGRES_DB:-retail_orders}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - retail-example-bci

volumes:
  retail-postgres-data-bci:
  retail-collector-queue-bci:

networks:
  retail-example-bci:
    name: retail-example-bci
