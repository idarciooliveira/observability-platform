services:
  retail-api:
    build:
      context: ./retail-api
      dockerfile: Dockerfile
    container_name: example-retail-api
    restart: unless-stopped
    ports:
      - "${RETAIL_API_PORT:-8084}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      retail-collector:
        condition: service_started
    networks:
      # App joins ONLY its customer network. No direct path to the platform;
      # the collector owns the platform leg.
      - retail-example
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-retail_orders}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-retail_orders}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-retail_orders}
      # App -> LOCAL collector only (plaintext, no token, no TLS).
      # The collector holds DIGIFLOW_OTEL_TOKEN and forwards via OTLP/HTTP.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-retail-api}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=retail,deployment.environment=${ENV:-dev}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://retail-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
      CHAOS_FAIL_RATE: ${CHAOS_FAIL_RATE:-0}

  retail-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: example-retail-collector
    restart: unless-stopped
    # File-backed queue volume arrives root-owned and the image runs non-root;
    # root here mirrors the tempo concession in compose.local.yml (local demo only).
    user: "0"
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./collector/collector-config.yaml:/etc/otel/collector-config.yaml:ro
      - retail-collector-queue:/var/lib/otelcol
    networks:
      - retail-example
    extra_hosts:
      # No-op on Docker Desktop (Win/Mac); required on native Linux Engine.
      - "host.docker.internal:host-gateway"
    environment:
      # digiflow tenant credential from observability-platform/.env.
      # Must match DIGIFLOW_OTEL_TOKEN in the platform .env; the gateway
      # derives project.id=digiflow from it and overwrites client values.
      DIGIFLOW_OTEL_TOKEN: ${DIGIFLOW_OTEL_TOKEN:?DIGIFLOW_OTEL_TOKEN must be set}
    healthcheck:
      test: ["NONE"]

  postgres:
    image: postgres:16-alpine
    container_name: example-retail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_orders}
      POSTGRES_USER: ${POSTGRES_USER:-retail_orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_orders}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - retail-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail_orders} -d ${POSTGRES_DB:-retail_orders}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - retail-example

volumes:
  retail-postgres-data:
  retail-collector-queue:

networks:
  retail-example:
    name: retail-example
