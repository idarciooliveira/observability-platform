spring.application.name=retail-orders-services

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/retail_orders}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:retail_orders}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:retail_orders}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.devtools.add-properties=true

# Phase 8-style fault injection defaults (overridden by env, no rebuild).
chaos.latency-ms=${CHAOS_LATENCY_MS:0}
chaos.fail-rate=${CHAOS_FAIL_RATE:0}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
