apiVersion: 1

# Platform Org (1) owns platform telemetry. Project orgs own only their own
# tenant telemetry and never receive the platform datasource.
deleteDatasources:
  - name: platform-metrics
    orgId: 1

datasources:
  - name: platform-metrics
    uid: platform-metrics
    type: prometheus
    orgId: 1
    url: http://mimir:9009/prometheus
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: platform

  - name: ubix-metrics
    type: prometheus
    orgId: 2
    url: http://mimir:9009/prometheus
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: ubix

  - name: ubix-logs
    type: loki
    orgId: 2
    url: http://loki:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: ubix

  - name: digiflow-metrics
    type: prometheus
    orgId: 3
    url: http://mimir:9009/prometheus
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: digiflow

  - name: digiflow-logs
    type: loki
    orgId: 3
    url: http://loki:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: digiflow

  - name: ubix-traces
    type: tempo
    orgId: 2
    url: http://tempo:3200
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: ubix

  - name: digiflow-traces
    type: tempo
    orgId: 3
    url: http://tempo:3200
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: digiflow

# Repeat per project. Never expose an unrestricted shared datasource.
