apiVersion: 1

providers:
  - name: platform
    orgId: 2
    folder: Platform
    type: file
    disableDeletion: true
    editable: false
    options:
      path: /var/lib/grafana/dashboards

  # Company dashboards expose the project selector. Project membership is
  # deliberately not modeled as a Grafana organization; it is a soft
  # project.id filter inside the company organization.
  - name: keve-projects
    orgId: 3
    folder: Projects
    type: file
    disableDeletion: true
    editable: false
    options:
      path: /var/lib/grafana/dashboards/keve

  - name: bci-projects
    orgId: 4
    folder: Projects
    type: file
    disableDeletion: true
    editable: false
    options:
      path: /var/lib/grafana/dashboards/bci
