auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 25

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

storage_config:
  filesystem:
    directory: /loki/chunks

pattern_ingester:
  enabled: true

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  # Keep project selection available in Grafana Explore. The collector
  # writes the authenticated project identity as project.id; indexing it
  # makes Loki expose the normalized project_id label to Grafana.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - project.id
  ingestion_rate_mb: 20
  ingestion_burst_size_mb: 30

analytics:
  reporting_enabled: false
