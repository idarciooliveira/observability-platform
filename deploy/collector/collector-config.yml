# Central OpenTelemetry Collector (internal).
#
# Trust model: this collector NEVER faces projects directly. The only writer
# is otel-gateway, which authenticates the instance Bearer token and routes
# each instance to its own private OTLP receiver below. Because routing happens
# before any telemetry is inspected, spoofed `project.id` / `tenant.id`
# resource attributes can never cross instances; the per-instance
# `transform/*_identity` processors then overwrite BOTH attributes with the
# authenticated values as defense in depth.
#
# Isolation model (company orgs, soft project isolation, proxy-ready):
#   tenant (company, HARD storage isolation): keve, bci -> X-Scope-OrgID on
#     the 6 SHARED company exporters below (Mimir, Loki and Tempo all use
#     X-Scope-OrgID for multitenancy when enabled server-side).
#   project (SOFT query isolation): ubix, digiflow -> `project.id` attribute
#     + default Grafana filter per project folder inside the company org.
#     Documented as soft: the company is the hard security boundary.
#   instance (ingest identity): keve_ubix, keve_digiflow, bci_ubix,
#     bci_digiflow -> 4 receivers, 4 identity transforms, 12 pipelines
#     (traces|metrics|logs per instance -> shared company exporter).
#
# Both `tenant.id` (<company>) and `project.id` (<project>) are stored from
# day one, so a future read-proxy (Keycloak JWT -> allowed (tenant,project)
# -> inject PromQL/LogQL/TraceQL filter + audit log) or a migration to hard
# per-project OrgIDs needs NO ingest redesign.
#
# Adding an instance: add otlp/<instance> receiver on the next 43xx port, a
# transform/<instance>_identity processor setting both IDs, reuse the
# company exporters (or add otlphttp/{mimir,loki,tempo}_<company> for a new
# company), three pipelines, and the matching gateway env vars
# (see deploy/collector/tenant-routing.yml and scripts/add-instance.py).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # Private per-instance ingress. Bound to the compose network only; the
  # gateway is the sole client. HTTP only (gateway proxies OTLP/HTTP).
  otlp/keve_ubix:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        include_metadata: true
  otlp/keve_digiflow:
    protocols:
      http:
        endpoint: 0.0.0.0:4320
        include_metadata: true
  otlp/bci_ubix:
    protocols:
      http:
        endpoint: 0.0.0.0:4321
        include_metadata: true
  otlp/bci_digiflow:
    protocols:
      http:
        endpoint: 0.0.0.0:4322
        include_metadata: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  batch: {}

  # Trusted identity: overwrite any client-supplied tenant.id / project.id
  # with the instance that owns this pipeline. `set` replaces spoofed values
  # and creates the attributes when absent, so both values can never coexist.
  transform/keve_ubix_identity:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "keve")
          - set(attributes["project.id"], "ubix")
    metric_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "keve")
          - set(attributes["project.id"], "ubix")
    log_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "keve")
          - set(attributes["project.id"], "ubix")

  transform/keve_digiflow_identity:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "keve")
          - set(attributes["project.id"], "digiflow")
    metric_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "keve")
          - set(attributes["project.id"], "digiflow")
    log_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "keve")
          - set(attributes["project.id"], "digiflow")

  transform/bci_ubix_identity:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "bci")
          - set(attributes["project.id"], "ubix")
    metric_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "bci")
          - set(attributes["project.id"], "ubix")
    log_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "bci")
          - set(attributes["project.id"], "ubix")

  transform/bci_digiflow_identity:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "bci")
          - set(attributes["project.id"], "digiflow")
    metric_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "bci")
          - set(attributes["project.id"], "digiflow")
    log_statements:
      - context: resource
        statements:
          - set(attributes["tenant.id"], "bci")
          - set(attributes["project.id"], "digiflow")

  # Minimal secret redaction on resource attributes. Full PII scrubbing of
  # span/log bodies remains follow-up work (see docs/collector-outage.md).
  transform/redact_pii:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["password"], "[REDACTED]") where attributes["password"] != nil
          - set(attributes["passwd"], "[REDACTED]") where attributes["passwd"] != nil
          - set(attributes["secret"], "[REDACTED]") where attributes["secret"] != nil
          - set(attributes["api_key"], "[REDACTED]") where attributes["api_key"] != nil
          - set(attributes["client_secret"], "[REDACTED]") where attributes["client_secret"] != nil
          - set(attributes["auth_token"], "[REDACTED]") where attributes["auth_token"] != nil
          - set(attributes["authorization"], "[REDACTED]") where attributes["authorization"] != nil
    metric_statements:
      - context: resource
        statements:
          - set(attributes["password"], "[REDACTED]") where attributes["password"] != nil
          - set(attributes["passwd"], "[REDACTED]") where attributes["passwd"] != nil
          - set(attributes["secret"], "[REDACTED]") where attributes["secret"] != nil
          - set(attributes["api_key"], "[REDACTED]") where attributes["api_key"] != nil
          - set(attributes["client_secret"], "[REDACTED]") where attributes["client_secret"] != nil
          - set(attributes["auth_token"], "[REDACTED]") where attributes["auth_token"] != nil
          - set(attributes["authorization"], "[REDACTED]") where attributes["authorization"] != nil
    log_statements:
      - context: resource
        statements:
          - set(attributes["password"], "[REDACTED]") where attributes["password"] != nil
          - set(attributes["passwd"], "[REDACTED]") where attributes["passwd"] != nil
          - set(attributes["secret"], "[REDACTED]") where attributes["secret"] != nil
          - set(attributes["api_key"], "[REDACTED]") where attributes["api_key"] != nil
          - set(attributes["client_secret"], "[REDACTED]") where attributes["client_secret"] != nil
          - set(attributes["auth_token"], "[REDACTED]") where attributes["auth_token"] != nil
          - set(attributes["authorization"], "[REDACTED]") where attributes["authorization"] != nil

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

  # Mimir OTLP ingestion: http://mimir:9009/otlp (X-Scope-OrgID = company).
  # Shared per company: both <company> instances fan into the same exporter.
  otlphttp/mimir_keve:
    endpoint: http://mimir:9009/otlp
    headers:
      X-Scope-OrgID: keve
    retry_on_failure: { enabled: true }
    sending_queue: { enabled: true, queue_size: 10000 }
  otlphttp/mimir_bci:
    endpoint: http://mimir:9009/otlp
    headers:
      X-Scope-OrgID: bci
    retry_on_failure: { enabled: true }
    sending_queue: { enabled: true, queue_size: 10000 }

  # Loki OTLP ingestion (available since Loki 2.9): X-Scope-OrgID = company.
  otlphttp/loki_keve:
    endpoint: http://loki:3100/otlp
    headers:
      X-Scope-OrgID: keve
    retry_on_failure: { enabled: true }
    sending_queue: { enabled: true, queue_size: 10000 }
  otlphttp/loki_bci:
    endpoint: http://loki:3100/otlp
    headers:
      X-Scope-OrgID: bci
    retry_on_failure: { enabled: true }
    sending_queue: { enabled: true, queue_size: 10000 }

  # Tempo OTLP ingestion with multitenancy_enabled: X-Scope-OrgID = company.
  otlphttp/tempo_keve:
    endpoint: http://tempo:4318
    headers:
      X-Scope-OrgID: keve
    retry_on_failure: { enabled: true }
    sending_queue: { enabled: true, queue_size: 10000 }
  otlphttp/tempo_bci:
    endpoint: http://tempo:4318
    headers:
      X-Scope-OrgID: bci
    retry_on_failure: { enabled: true }
    sending_queue: { enabled: true, queue_size: 10000 }

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: INFO
  pipelines:
    traces/keve_ubix:
      receivers: [otlp/keve_ubix]
      processors: [memory_limiter, transform/keve_ubix_identity, transform/redact_pii, batch]
      exporters: [otlphttp/tempo_keve, debug]
    metrics/keve_ubix:
      receivers: [otlp/keve_ubix]
      processors: [memory_limiter, transform/keve_ubix_identity, transform/redact_pii, batch]
      exporters: [otlphttp/mimir_keve, debug]
    logs/keve_ubix:
      receivers: [otlp/keve_ubix]
      processors: [memory_limiter, transform/keve_ubix_identity, transform/redact_pii, batch]
      exporters: [otlphttp/loki_keve, debug]
    traces/keve_digiflow:
      receivers: [otlp/keve_digiflow]
      processors: [memory_limiter, transform/keve_digiflow_identity, transform/redact_pii, batch]
      exporters: [otlphttp/tempo_keve, debug]
    metrics/keve_digiflow:
      receivers: [otlp/keve_digiflow]
      processors: [memory_limiter, transform/keve_digiflow_identity, transform/redact_pii, batch]
      exporters: [otlphttp/mimir_keve, debug]
    logs/keve_digiflow:
      receivers: [otlp/keve_digiflow]
      processors: [memory_limiter, transform/keve_digiflow_identity, transform/redact_pii, batch]
      exporters: [otlphttp/loki_keve, debug]
    traces/bci_ubix:
      receivers: [otlp/bci_ubix]
      processors: [memory_limiter, transform/bci_ubix_identity, transform/redact_pii, batch]
      exporters: [otlphttp/tempo_bci, debug]
    metrics/bci_ubix:
      receivers: [otlp/bci_ubix]
      processors: [memory_limiter, transform/bci_ubix_identity, transform/redact_pii, batch]
      exporters: [otlphttp/mimir_bci, debug]
    logs/bci_ubix:
      receivers: [otlp/bci_ubix]
      processors: [memory_limiter, transform/bci_ubix_identity, transform/redact_pii, batch]
      exporters: [otlphttp/loki_bci, debug]
    traces/bci_digiflow:
      receivers: [otlp/bci_digiflow]
      processors: [memory_limiter, transform/bci_digiflow_identity, transform/redact_pii, batch]
      exporters: [otlphttp/tempo_bci, debug]
    metrics/bci_digiflow:
      receivers: [otlp/bci_digiflow]
      processors: [memory_limiter, transform/bci_digiflow_identity, transform/redact_pii, batch]
      exporters: [otlphttp/mimir_bci, debug]
    logs/bci_digiflow:
      receivers: [otlp/bci_digiflow]
      processors: [memory_limiter, transform/bci_digiflow_identity, transform/redact_pii, batch]
      exporters: [otlphttp/loki_bci, debug]
