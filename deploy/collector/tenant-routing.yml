# Tenant routing registry: source of truth for credential -> instance mapping.
#
# Model (Option B, soft project isolation, proxy-ready):
#   tenant (company, hard storage isolation, X-Scope-OrgID): keve, bci
#   project (soft query isolation, project.id + tenant.id attrs): ubix, digiflow
#   instance (ingest identity, 1 credential -> 1 pipeline): keve_ubix,
#     keve_digiflow, bci_ubix, bci_digiflow
#
# SECURITY RULES (enforced, not advisory):
# - Instance identity comes ONLY from the authenticated Bearer credential.
# - The client-supplied `project.id` / `tenant.id` resource attributes are
#   never trusted: the gateway routes the request to the credential owner's
#   private pipeline, whose transform processor overwrites BOTH attributes.
# - Unknown credentials are rejected with 401 and never reach any backend.
# - Storage isolation is per COMPANY (storage_tenant -> X-Scope-OrgID).
#   Project isolation inside a company is SOFT (default Grafana filter on
#   project.id; a future read-proxy can enforce it — both IDs are stored
#   from day one, so no re-ingestion is needed).
#
# NO SECRETS IN THIS FILE. Tokens live in the environment / secret manager:
#   KEVE_UBIX_OTEL_TOKEN, KEVE_DIGIFLOW_OTEL_TOKEN, BCI_UBIX_OTEL_TOKEN, BCI_DIGIFLOW_OTEL_TOKEN (see .env.example).
# The gateway refuses to start if any instance below has no token configured.

gateway:
  image: otel-gateway (built from ./gateway)
  listen: 0.0.0.0:4318
  tenants_env: GATEWAY_TENANTS  # "keve_ubix,keve_digiflow,bci_ubix,bci_digiflow"

tenants:
  keve_ubix:
    tenant: keve_ubix
    project: ubix
    storage_tenant: keve # sent as X-Scope-OrgID to Mimir, Loki and Tempo
    token_env: KEVE_UBIX_OTEL_TOKEN
    collector_receiver: otlp/keve_ubix
    collector_upstream: http://otel-collector:4319
    max_series: 250000
    log_rate_mb: 20
  keve_digiflow:
    tenant: keve_digiflow
    project: digiflow
    storage_tenant: keve # sent as X-Scope-OrgID to Mimir, Loki and Tempo
    token_env: KEVE_DIGIFLOW_OTEL_TOKEN
    collector_receiver: otlp/keve_digiflow
    collector_upstream: http://otel-collector:4320
    max_series: 250000
    log_rate_mb: 20
  bci_ubix:
    tenant: bci_ubix
    project: ubix
    storage_tenant: bci # sent as X-Scope-OrgID to Mimir, Loki and Tempo
    token_env: BCI_UBIX_OTEL_TOKEN
    collector_receiver: otlp/bci_ubix
    collector_upstream: http://otel-collector:4321
    max_series: 250000
    log_rate_mb: 20
  bci_digiflow:
    tenant: bci_digiflow
    project: digiflow
    storage_tenant: bci # sent as X-Scope-OrgID to Mimir, Loki and Tempo
    token_env: BCI_DIGIFLOW_OTEL_TOKEN
    collector_receiver: otlp/bci_digiflow
    collector_upstream: http://otel-collector:4322
    max_series: 250000
    log_rate_mb: 20
