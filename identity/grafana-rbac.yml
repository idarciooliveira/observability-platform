# Grafana RBAC: flat Keycloak groups + GF_AUTH_GENERIC_OAUTH_ORG_MAPPING.
#
# Grafana orgs: Main:2, keve:3, bci:4 (company tenants; projects live
# inside their company org as folders/teams with a fixed project.id filter).
# (Fresh Grafana 12 reserves org 1 for the bootstrap admin's personal org;
# the platform does not use it.)
# - obs-platform-admins -> Admin 1,2,3,4,5 (Platform Team, unchanged)
# - keve-admins -> Admin 2,3 ; bci-admins -> Admin 4,5 (company-admin)
# - keve-ubix-viewers/editors -> Viewer/Editor 2 only, etc. (8 project groups)
# - cross-company lead, e.g. Domingos: member of keve-digiflow-editors +
#   bci-digiflow-editors -> Editor 3+4 only.
# Viewers: no Explore/create, dashboard-only with fixed project.id variable.
# Project-level is soft; company-level is the hard security boundary.
groups:
  /obs-platform-admins:
    organizations:
      Main Org.: Admin
      keve_ubix: Admin
      keve_digiflow: Admin
      bci_ubix: Admin
      bci_digiflow: Admin
  /keve-admins:
    organizations:
      keve_ubix: Admin
      keve_digiflow: Admin
  /bci-admins:
    organizations:
      bci_ubix: Admin
      bci_digiflow: Admin
  /keve-ubix-viewers:
    organizations:
      keve_ubix: Viewer
  /keve-ubix-editors:
    organizations:
      keve_ubix: Editor
  /keve-digiflow-viewers:
    organizations:
      keve_digiflow: Viewer
  /keve-digiflow-editors:
    organizations:
      keve_digiflow: Editor
  /bci-ubix-viewers:
    organizations:
      bci_ubix: Viewer
  /bci-ubix-editors:
    organizations:
      bci_ubix: Editor
  /bci-digiflow-viewers:
    organizations:
      bci_digiflow: Viewer
  /bci-digiflow-editors:
    organizations:
      bci_digiflow: Editor

# Each company organization has company-wide datasources sharing its
# company header, plus a fixed project.id dashboard filter (soft).
